name: build

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ${{ matrix.host.image }}

    strategy:
      # Cancel all in-progress and queued jobs in the matrix if any job in the matrix fails
      fail-fast: true

      # matrix docs: https://docs.github.com/en/actions/writing-workflows/workflow-syntax-for-github-actions#jobsjob_idstrategymatrix
      matrix:
        build_type: [Debug, RelWithDebInfo, Release, MinSizeRel]
        # image states
        # windows-2022: https://github.com/actions/runner-images/blob/main/images/windows/Windows2022-Readme.md
        # ubuntu-24.04: https://github.com/actions/runner-images/blob/main/images/ubuntu/Ubuntu2404-Readme.md
        # macos-14:     https://github.com/actions/runner-images/blob/main/images/macos/macos-14-Readme.md
        host:
          # cl configurations
          - { cpp_compiler: cl,         c_compiler: cl,       image: windows-2022, generator: Visual Studio 17 2022 }
          - { cpp_compiler: cl,         c_compiler: cl,       image: windows-2025, generator: Visual Studio 17 2022 }
          # clang++ configurations
          - { cpp_compiler: clang++-16, c_compiler: clang-16, image: ubuntu-24.04, generator: Unix Makefiles        }
          - { cpp_compiler: clang++-17, c_compiler: clang-17, image: ubuntu-24.04, generator: Unix Makefiles        }
          - { cpp_compiler: clang++-18, c_compiler: clang-18, image: ubuntu-24.04, generator: Unix Makefiles        }
          - { cpp_compiler: clang++,    c_compiler: clang,    image: macos-14,     generator: Unix Makefiles        } # GHA docs say this is version 15.0.0
          # g++ configurations
          - { cpp_compiler: g++,        c_compiler: gcc,      image: windows-2022, generator: MinGW Makefiles       } # GHA docs say this is version 12.2.0
          - { cpp_compiler: g++-12,     c_compiler: gcc-12,   image: ubuntu-24.04, generator: Unix Makefiles        }
          - { cpp_compiler: g++-13,     c_compiler: gcc-13,   image: ubuntu-24.04, generator: Unix Makefiles        }
          - { cpp_compiler: g++-14,     c_compiler: gcc-14,   image: ubuntu-24.04, generator: Unix Makefiles        }
          - { cpp_compiler: g++,        c_compiler: gcc,      image: macos-14,     generator: Unix Makefiles        }
        include:
          - build_type: Coverage
            host: { cpp_compiler: clang++-18, c_compiler: clang-18, image: ubuntu-24.04, generator: Unix Makefiles }

    env:
      VCPKG_ROOT: ${{ github.workspace }}/code/deps/vcpkg
      VCPKG_BINARY_CACHE: ${{ github.workspace }}/.vcpkg_binary_cache
      VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}/.vcpkg_binary_cache,readwrite
      VCPKG_FEATURE_FLAGS: manifests,binarycaching

    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      # Use this to set up an open ssh debugging session with CI
      # - name: Setup ssh session
      #   uses: lhotari/action-upterm@v1

      - name: Compute vcpkg SHA
        shell: bash
        run: echo "VCPKG_SHA=$(git -C code/deps/vcpkg rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Set reusable strings
        # Turn repeated input strings (such as the presets) into step outputs. These step outputs can be used throughout the workflow file.
        id: strings
        shell: bash
        run: |
          echo "configure-preset=${{ matrix.host.preset_prefix }}-${{ matrix.build_type }}" >> "$GITHUB_OUTPUT"
          echo "build-preset=${{ matrix.host.preset_prefix }}-${{ matrix.build_type }}" >> "$GITHUB_OUTPUT"
          echo "tests-output-dir=${{ github.workspace }}/out/build/code/tests/TARGET" >> "$GITHUB_OUTPUT"

          if [[ "${RUNNER_OS}" == "Windows" ]]; then
            echo "compiler-cacher"=sccache >> "$GITHUB_OUTPUT"
          else
            echo "compiler-cacher"=ccache >> "$GITHUB_OUTPUT"
          fi

      - name: Cache vcpkg downloads
        uses: actions/cache@v4
        with:
          path: ${{ env.VCPKG_ROOT }}/downloads
          key: vcpkgdl-${{ matrix.host.image }}-vcpkg:${{ env.VCPKG_SHA }}-manifest:${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}
          restore-keys: |
            vcpkgdl-${{ matrix.host.image }}-vcpkg:${{ env.VCPKG_SHA }}

      - name: Cache vcpkg binaries
        uses: actions/cache@v4
        with:
          path: ${{ env.VCPKG_BINARY_CACHE }}
          key: >
            vcpkgbin-${{ matrix.host.image }}-${{ matrix.build_type }}-${{ matrix.host.preset_prefix }}
            -vcpkg:${{ env.VCPKG_SHA }}
            -manifest:${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}

      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2
        if: runner.os != 'Windows'
        with:
          key: ccache-${{ matrix.host.image }}-${{ matrix.build_type }}-${{ matrix.host.preset_prefix }}
          max-size: 500M

      - name: sccache
        uses: hendrikmuhs/ccache-action@v1.2
        if: runner.os == 'Windows'
        with:
          variant: sccache
          key: ccache-${{ matrix.host.image }}-${{ matrix.build_type }}-${{ matrix.host.preset_prefix }}
          max-size: 500M

      - name: bootstrap vcpkg (windows)
        if: runner.os == 'Windows'
        run: ${{ github.workspace }}\code\deps\vcpkg\bootstrap-vcpkg.bat -disableMetrics

      - name: bootstrap vcpkg (mac)
        if: runner.os != 'Windows'
        run: ${{ github.workspace }}/code/deps/vcpkg/bootstrap-vcpkg.sh -disableMetrics

      - name: Setup MSVC dev environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure CMake
        run: >
          cmake --preset ${{ steps.strings.outputs.configure-preset }}
          -DCMAKE_C_COMPILER_LAUNCHER=${{ steps.strings.outputs.compiler-cacher }}
          -DCMAKE_CXX_COMPILER_LAUNCHER=${{ steps.strings.outputs.compiler-cacher }}

      - name: Build
        run: cmake --build --preset ${{ steps.strings.outputs.build-preset }}

      - name: Test
        # Execute tests defined by the CMake configuration. Note that --build-config is needed because the default Windows generator is a multi-config generator (Visual Studio generator).
        # See https://cmake.org/cmake/help/latest/manual/ctest.1.html for more detail
        run: ctest --test-dir out/build/${{ steps.strings.outputs.build-preset }} --build-config ${{ matrix.build_type }} --output-on-failure --no-tests=error

      - name: Compute Code Coverage
        if: ${{ matrix.build_type == 'Coverage' }}
        working-directory: ${{ steps.strings.outputs.tests-output-dir }}
        ## Execute test coverage
        run: |
          ./tests
          llvm-profdata-18 merge default.profraw -o tests.profdata
          llvm-cov-18 show tests -instr-profile=tests.profdata -show-instantiation-summary ${{ steps.strings.outputs.src-dir }} > coverage-lines.txt
          llvm-cov-18 report tests -instr-profile=tests.profdata -show-instantiation-summary ${{ steps.strings.outputs.src-dir }} > coverage-files.txt

      - name: Upload coverage to github
        if: ${{ matrix.build_type == 'Coverage' }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: ${{ steps.strings.outputs.tests-output-dir }}/coverage-*.txt

      - name: Upload coverage to codecov
        if: ${{ matrix.build_type == 'Coverage' }}
        uses: codecov/codecov-action@v4
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        with:
          files: ${{ steps.strings.outputs.tests-output-dir }}/coverage-lines.txt
          fail_ci_if_error: true

  docs:
    runs-on: ubuntu-24.04

    steps:
      - name: checkout
        uses: actions/checkout@v3

      - name: Install Doxygen
        run: sudo apt-get install doxygen graphviz -y

      - name: Configure CMake
        run: cmake -B ${{ github.workspace }}/build -S ${{ github.workspace }}

      - name: Generate docs
        run: cmake --build ${{ github.workspace }}/build --target docs

      # TODO: possibly host docs on github pages (helpful link: https://github.com/DenverCoder1/doxygen-github-pages-action)